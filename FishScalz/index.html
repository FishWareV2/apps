<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FishScalz</title>
<meta name="description" content="Estimate a fish's weight from its length, species and relative weight (Wr).">
<style>
  :root {
    --bg: #f5f5f2; --card: #ffffff; --text: #1b1b1b; --muted: #6b6b6b; --border: #e2e2de;
    --accent: #2f5bd3; --accent-soft: #eaf0fd; --entry: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121212; --card: #1c1c1c; --text: #ececec; --muted: #9a9a9a; --border: #2e2e2e;
      --accent: #7aa2ff; --accent-soft: #1f2a44; --entry: #151515;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121212; --card: #1c1c1c; --text: #ececec; --muted: #9a9a9a; --border: #2e2e2e;
    --accent: #7aa2ff; --accent-soft: #1f2a44; --entry: #151515;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 56px; }
  h1 { margin: 0 0 4px; font-size: 1.8rem; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  label { display: block; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 4px; }
  select, input[type=number] { width: 100%; padding: 9px 10px; font: inherit; color: var(--text);
    background: var(--entry); border: 1px solid var(--border); border-radius: 8px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .row > div.full { grid-column: 1 / -1; }
  .coef { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; margin-top: 16px; }
  .coef div { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; }
  .coef b { display: block; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
  .coef span { font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .eq { margin: 12px 0 0; color: var(--muted); font-size: .85rem; font-family: ui-monospace, Menlo, monospace; }
  .wr { display: flex; justify-content: space-between; align-items: baseline; }
  .wr b { font-size: 1.3rem; color: var(--accent); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 8px 0 0; }
  .ticks { position: relative; height: 2.6em; font-size: .75rem; color: var(--muted); }
  .ticks span { position: absolute; top: 0; transform: translateX(-50%); text-align: center; white-space: nowrap; line-height: 1.3; }
  .ticks span::before { content: ""; display: block; width: 2px; height: 8px; margin: 0 auto 2px; background: var(--muted); }
  .ticks .avg { color: var(--accent); font-weight: 600; }
  .ticks .avg::before { background: var(--accent); height: 12px; }
  .result { text-align: center; }
  .result .params, .result #src { text-align: left; }
  .params { margin: 16px 0 4px; padding-top: 12px; border-top: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  .result .big { font-size: 2.6rem; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .result .alt { color: var(--muted); font-variant-numeric: tabular-nums; }
  .result .ws { margin-top: 10px; font-size: .9rem; color: var(--muted); }
  .note { color: var(--muted); font-size: .85rem; }
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 10px; }
  .tabs button { font: inherit; font-size: .85rem; padding: 8px 4px; cursor: pointer; color: var(--muted);
    background: var(--entry); border: 1px solid var(--border); border-radius: 8px; }
  .tabs button[aria-selected=true] { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
  .warn { margin-top: 8px; font-size: .85rem; color: #c62828; }
  :root[data-theme="dark"] .warn { color: #ff6b6b; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .warn { color: #ff6b6b; } }
  .back { display: inline-block; margin-bottom: 12px; color: var(--accent); text-decoration: none; font-size: .9rem; }
</style>
</head>
<body>
<main>
  <a class="back" href="../">← Fisheries Tools</a>
  <h1>FishScalz</h1>
  <p class="sub">Estimate a fish's weight from its length, species and relative weight (Wr).</p>

  <div class="card">
    <label id="tabLabel">Species group</label>
    <div class="tabs" id="tabs" role="tablist" aria-labelledby="tabLabel"></div>
    <select id="species" aria-label="Species"></select>
  </div>

  <div class="card">
    <div class="row" style="margin-top:0">
      <div>
        <label for="len" id="lenLabel">Length</label>
        <input id="len" type="number" min="0" step="any" value="12">
      </div>
      <div>
        <label for="lenUnit">Length units</label>
        <select id="lenUnit"><option value="in">English (inches)</option><option value="mm">Metric (mm)</option></select>
      </div>
      <div class="full">
        <label for="wtUnit">Weight units</label>
        <select id="wtUnit"><option value="en">English (lb / oz)</option><option value="met">Metric (g / kg)</option></select>
      </div>
    </div>
    <div style="margin-top:16px">
      <div class="wr"><label for="wr" style="margin:0">Relative weight <span style="text-transform:none">(Wr)</span></label><b id="wrVal">93</b></div>
      <input id="wr" type="range" min="50" max="150" step="1" value="93">
      <div class="ticks">
        <span style="left:calc(8px + 0 * (100% - 16px))">50<br>thin</span>
        <span class="avg" style="left:calc(8px + .43 * (100% - 16px))">93<br>average</span>
        <span style="left:calc(8px + 1 * (100% - 16px))">150<br>plump</span>
      </div>
    </div>
  </div>

  <div class="card result">
    <div class="big" id="out">–</div>
    <div class="alt" id="alt"></div>
    <div class="ws" id="ws"></div>
    <div class="warn" id="warn"></div>
    <p class="params" id="params"></p>
    <p class="note" id="src"></p>
  </div>

  <p class="note" id="foot">Standard-weight equations are read from standard_weight_equations_English.csv.</p>
</main>

<script>
// Equations come from standard_weight_equations_English.csv (lengths in inches, weights in pounds):
//   log10 Ws(lb) = int + slope * log10 L(in) + quad * (log10 L(in))^2
const GROUPS = [["Salmonid", "Salmonids"], ["Sucker", "Suckers"], ["Warmwater", "Warmwater"], ["Minnows et al.", "Minnows et al."]];
const G_PER_LB = 453.59237, MM_PER_IN = 25.4;
const $ = id => document.getElementById(id);

function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); f = ""; if (row.some(x => x !== "")) rows.push(row); row = []; }
    else f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  const head = rows.shift().map(h => h.trim());
  return rows.map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? "").trim()])));
}
const num = v => { const x = parseFloat(v); return Number.isFinite(x) ? x : null; };

let species = [], active = null, group = GROUPS[0][0];

function pickGroup(g, keepSpecies) {
  group = g;
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.g === g));
  const sel = $("species"); sel.innerHTML = "";
  for (const s of species.filter(s => s.group === g)) {
    const o = document.createElement("option"); o.value = s.idx; o.textContent = s.name; sel.append(o);
  }
  if (!keepSpecies && sel.options.length) sel.selectedIndex = 0;
  update();
}

const fmt = (x, d) => x.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
const trim = x => String(+x.toFixed(5));

function update() {
  const sp = species[+$("species").value];
  active = sp || null;
  $("params").textContent = sp
    ? `Slope: ${trim(sp.slope)} · Intercept: ${trim(sp.int)}` + (sp.quad ? ` · Quadratic: ${trim(sp.quad)}` : "")
    : "";
  $("src").textContent = sp ? `${sp.method} equation · ${sp.source}` + (sp.comment && sp.comment !== "none" ? ` · ${sp.comment}` : "") : "";
  $("lenLabel").textContent = sp ? `Length (${sp.measure})` : "Length";

  const wr = +$("wr").value; $("wrVal").textContent = wr;
  const len = parseFloat($("len").value);
  const inches = $("lenUnit").value === "in" ? len : len / MM_PER_IN;
  $("warn").textContent = "";
  if (!sp || !(inches > 0)) { $("out").textContent = "–"; $("alt").textContent = ""; $("ws").textContent = ""; return; }
  const x = Math.log10(inches);
  const wsLb = Math.pow(10, sp.int + sp.slope * x + (sp.quad || 0) * x * x);
  const lb = wsLb * wr / 100, g = lb * G_PER_LB, mm = inches * MM_PER_IN;
  if ($("wtUnit").value === "met") {
    $("out").textContent = g >= 1000 ? `${fmt(g / 1000, 3)} kg` : `${fmt(g, 0)} g`;
    $("alt").textContent = g >= 1000 ? `${fmt(g, 0)} g` : `${fmt(g / 1000, 3)} kg`;
    $("ws").textContent = `Standard weight (Wr 100): ${fmt(wsLb * G_PER_LB, 0)} g`;
  } else {
    $("out").textContent = lb >= 1 ? `${fmt(lb, 2)} lb` : `${fmt(lb * 16, 1)} oz`;
    $("alt").textContent = lb >= 1 ? `${Math.floor(lb)} lb ${fmt((lb - Math.floor(lb)) * 16, 1)} oz` : `${fmt(lb, 3)} lb`;
    $("ws").textContent = `Standard weight (Wr 100): ${fmt(wsLb, 2)} lb`;
  }
  $("ws").textContent += ` at ${fmt(mm, 0)} mm / ${fmt(inches, 1)} in`;
  if (sp.minIn != null && inches < sp.minIn) $("warn").textContent = `Shorter than the ${fmt(sp.minIn, 1)} in minimum length this equation was built for.`;
  else if (sp.maxIn != null && inches > sp.maxIn) $("warn").textContent = `Longer than the ${fmt(sp.maxIn, 1)} in maximum length this equation was built for.`;
}

// Changing the length unit converts the typed number so it stays the same fish.
let prevUnit = $("lenUnit").value;
$("lenUnit").addEventListener("change", () => {
  const v = parseFloat($("len").value), u = $("lenUnit").value;
  if (v > 0 && u !== prevUnit) $("len").value = u === "mm" ? Math.round(v * MM_PER_IN) : +(v / MM_PER_IN).toFixed(1);
  prevUnit = u; update();
});
["species", "len", "wr", "wtUnit"].forEach(id => $(id).addEventListener("input", update));

async function init() {
  const tabs = $("tabs");
  for (const [key, label] of GROUPS) {
    const b = document.createElement("button");
    b.type = "button"; b.role = "tab"; b.dataset.g = key; b.textContent = label;
    b.addEventListener("click", () => pickGroup(key));
    tabs.append(b);
  }
  try {
    const res = await fetch("standard_weight_equations_English.csv");
    if (!res.ok) throw new Error(res.status);
    const rows = parseCSV(await res.text());
    // Length limits in the CSV are inches, except a few rows given in mm (values of 50 or more).
    const toIn = v => v == null ? null : (v >= 50 ? v / MM_PER_IN : v);
    species = rows.map((r, idx) => ({
      idx, name: r.species, group: r.group.trim(), measure: r.measure, method: r.method,
      int: num(r.int), slope: num(r.slope), quad: num(r.quad),
      minIn: toIn(num(r["min.len"])), maxIn: toIn(num(r["max.len"])),
      source: r.source, comment: r.comment,
    })).filter(s => s.name && s.int != null && s.slope != null);
  } catch (e) {
    $("src").textContent = "Could not load standard_weight_equations_English.csv. Serve the folder over http (python3 -m http.server) instead of opening the file directly.";
    return;
  }
  const start = species.find(s => s.name === "Rainbow Trout (lotic)") || species[0];
  pickGroup(start.group);
  $("species").value = start.idx; update();
}
init();
</script>
</body>
</html>
